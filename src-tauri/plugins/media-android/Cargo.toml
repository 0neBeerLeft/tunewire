[package]
name = "tauri-plugin-media-android"
version = "0.1.0"
edition = "2021"
description = "Android playback service: media notification, lock-screen and headset controls, opening links"
links = "tauri-plugin-media-android"
publish = false

[dependencies]
tauri = "2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
